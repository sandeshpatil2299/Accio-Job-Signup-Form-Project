<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Created Signup form using  html and css with given instructions and requirements">
    <title>Signup Form Design</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>

<body>
    <section id="signupForm">
        <header>
            <h1 class="heading">
                Signup
            </h1>
        </header>

        <main>
            <form action="" method="post">
                <div>
                    <input type="text" id="name" class="inputs customPadding" name="name" placeholder="Full Name" required>
                </div>

                <div>
                    <input type="email" id="email" class="inputs customPadding" name="email" placeholder="Email" required>
                </div>

                <div>
                    <input type="password" id="password" class="inputs customPadding" name="password" placeholder="Password" minlength="8"  pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$" title="Must contain at least one uppercase letter, one lowercase letter, one number, and one special character. Minimum 8 characters." required>
                </div>

                <div>
                    <input type="password" id="confirmPassword" class="inputs customPadding" name="confirmPassword" placeholder="Confirm Password"
                     minlength="8"  pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$" title="Must contain at least one uppercase letter, one lowercase letter, one number, and one special character. Minimum 8 characters." required>
                </div>

                <div>
                    <input type="text" id="date" class="inputs customPadding" name="date" placeholder="MM/DD/YYYY" required>
                </div>

                <div class="customPadding customColor">
                    <input type="radio" name="user" value="student" id="student">
                    <label for="student">Student</label>

                    <input type="radio" name="user" value="employee" id="employee" style="margin-left: 30px;">
                    <label for="employee">Employee</label>
                </div>

                <div class="customPadding customColor">
                    <input type="checkbox" name="term" id="term">
                    <label for="term">I agree to all the Terms and conditions</label>
                </div>

                <input class="btn" type="submit" value="Submit">
            </form>
        </main>
    </section>
</body>

</html>
